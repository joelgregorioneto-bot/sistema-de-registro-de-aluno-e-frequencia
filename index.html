<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema de Registro de Alunos - Colégio Estadual Presidente Kennedy">
    <title>Chamada Digital - Colégio Estadual Presidente Kennedy</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/print.css" media="print">
    
    <!-- Favicon -->
    <link rel="icon" href="assets/favicon.ico">
    
    <!-- CSP Meta (reforço) -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; font-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self' https:;">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen" role="status" aria-label="Carregando sistema">
        <div class="loading-spinner"></div>
        <p class="loading-text">Carregando Chamada Digital...</p>
        <div class="loading-school">Colégio Estadual Presidente Kennedy</div>
    </div>

    <!-- App Container -->
    <div id="app" class="app hidden">
        <!-- Header/Navbar (apenas quando logado) -->
        <header id="header" class="header hidden" role="banner">
            <div class="header-content">
                <div class="header-brand">
                    <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                    </svg>
                    <span class="school-name">Colégio Estadual Presidente Kennedy</span>
                </div>
                <nav class="header-nav" role="navigation" aria-label="Navegação principal">
                    <button id="btn-dashboard" class="nav-btn active" data-route="dashboard" aria-current="page">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
                        <span>Dashboard</span>
                    </button>
                    <button id="btn-turmas" class="nav-btn" data-route="turmas">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                        <span>Turmas</span>
                    </button>
                    <button id="btn-chamada" class="nav-btn" data-route="chamada">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                        <span>Chamada</span>
                    </button>
                    <button id="btn-relatorios" class="nav-btn" data-route="relatorios">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                        <span>Relatórios</span>
                    </button>
                </nav>
                <div class="header-user">
                    <span id="user-name" class="user-name"></span>
                    <button id="btn-logout" class="btn btn-ghost btn-sm" aria-label="Sair do sistema">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                        <span>Sair</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main id="main-content" class="main-content" role="main">
            <!-- As views serão injetadas aqui pelo router -->
        </main>

        <!-- Footer -->
        <footer id="footer" class="footer hidden" role="contentinfo">
            <p>&copy; 2024 Colégio Estadual Presidente Kennedy - Sistema de Chamada Digital</p>
        </footer>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container" aria-live="polite" aria-label="Notificações"></div>

    <!-- Modal Container -->
    <div id="modal-container" class="modal-container" role="dialog" aria-modal="true" aria-labelledby="modal-title"></div>

    <!-- JavaScript Libraries (CDN com fallback local) -->
    <script src="https://cdn.jsdelivr.net/npm/bcryptjs@2.4.3/dist/bcrypt.min.js"></script>
    <script>window.bcrypt = window.bcrypt || {}; window.dcodeIO = window.dcodeIO || {};</script>
    
    <!-- App Scripts (ordem importa) -->
    <script src="js/utils.js"></script>
    <script src="js/db.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
    <script src="data/seed.js"></script>
</body>
</html>
